# This workflow publishes the npm package when a release is created.

name: NPM publish

on:
  release:
    # This specifies that the build will be triggered when we publish a release
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # "ref" specifies the branch to check out.
          # "github.event.release.target_commitish" is a global variable and
          # specifies the branch the release targeted
          ref: ${{ github.event.release.target_commitish }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is needed for `npm publish` and its registry authentication,
      # even though install/build/test run through bun.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/

      - name: ENVVARS
        run: |
          git config --global user.name "losandes cicd"
          git config --global user.email "andes.collab+ghcicd@gmail.com"
          echo "bun: $(bun --version)"
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          CI: true
        run: bun run typecheck && ./bin/test-agent

      - name: Build
        run: bun run build

      # upgrade npm version in package.json to the tag used in the release.
      - name: Set package version
        run: npm version ${{ github.event.release.tag_name }}

      # publish the package to NPM and set the tag name to the branch name
      # that the release is targeting (i.e. latest, latest-v1, etc.)
      # Note that npm version commits a tag to git
      # alsosee: https://michaelzanggl.com/articles/github-actions-cd-setup/
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag ${{ github.event.release.target_commitish }}

      - name: Push version change
        env:
          # The secret is passed automatically. Nothing to configure.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        run: git push
