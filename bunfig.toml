[build]
target = "node"

[test]
# directory to run tests in by default
root = "./src" # default "./src"

# Whether to skip test files when computing coverage statistics.
coverageSkipTestFiles = false # docs say default false, but I think it's true

coverageThreshold = 0.95 # { line = 0.7, function = 0.8, statement = 0.9 }

# Exclude specific files or file patterns from coverage reports using glob
# patterns. Can be a single string pattern or an array of patterns.
coveragePathIgnorePatterns = [
  "**/bin.ts",
  "**/bunt.ts",
  "**/spawn-bun-test.ts",
]

# Outputs for coverage reports.
# "text" for printing to the console
# "lcov" for generating persistent reports (for CI environments)
coverageReporter = ["text", "lcov"] # default ["text"]

# The path where coverage reports will be saved (for persistent
# coverageReporters like lcov).
coverageDir = ".coverage" # default "coverage"
