
# Lifecycle definitions. Activities are defined in crust.activities.yaml.
#
# Stages execute in order. Within each Stage, strategy determines execution:
#   serial      sequential, in listed order (default)
#   concurrent  parallel, with no dependencies or overlapping write permissions
#
# Concurrent Activities share a working tree. Overlapping `writes` are
# rejected at load. Review Activities can run concurrently because each
# reads the completed changes and writes to a separate findings file.
#
# Local overrides: crust.lifecycles.local.yaml (gitignored).
# Example: <pi-crust>/cookbooks/examples/crust.lifecycles.local.example.yaml

lifecycles:
  - name: bugfix
    description: >-
      Fix a reported bug, start to finish. Reproduction comes first and gates the
      rest.
    stages:
      - name: diagnose
        strategy: serial
        activities: [diagnose]
      - name: deliver
        strategy: serial
        activities: [plan, test-tdd, build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: de-risk
    description: >-
      Learn, disprove, de-risk. Evaluate a concept to determine its feasibility
      and learn through experimentation.
    stages:
      - name: discover
        strategy: serial
        activities: [identify]
      - name: prove
        strategy: serial
        activities: [plan, build]

  - name: deliver
    description: >-
      The engineering lifecycle: build, test, and review.
    stages:
      - name: deliver
        strategy: serial
        activities: [build, test]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: discover
    description: >-
      The product lifecycle: identify, conceptualize, plan.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, conceptualize, plan]

  - name: gh-issue
    description: >-
      Analyze a topic, plan the work, and open a github issue.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, plan, gh-issue]

  - name: ship
    description: >-
      The engineering lifecycle: plan, build, and review.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, plan]
      - name: deliver
        strategy: serial
        activities: [build, test]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]
