
# Lifecycle definitions. Activities are defined in crust.activities.yaml.
#
# Stages execute in order. Within each Stage, strategy determines execution:
#   serial      sequential, in listed order (default)
#   concurrent  parallel, with no dependencies or overlapping write permissions
#
# Concurrent Activities share a working tree. Overlapping `writes` are
# rejected at load. Review Activities can run concurrently because each
# reads the completed changes and writes to a separate findings file.
#
# `import` is not an Activity. Named first in a Lifecycle's first Stage, it
# brings the issue or document the request references into the handoff
# directory before anything runs. See <pi-crust>/references/handoff.md.
#
# Local overrides: crust.lifecycles.local.yaml (gitignored).
# Example: <pi-crust>/cookbooks/examples/crust.lifecycles.local.example.yaml

lifecycles:
  - name: bugfix
    description: >-
      Fix a reported bug, start to finish. Reproduction comes first and gates the
      rest.
    stages:
      - name: diagnose
        strategy: serial
        activities: [diagnose, plan]
      - name: review-plan
        strategy: concurrent
        activities: [plan-comprehension, plan-readiness]
      - name: deliver
        strategy: serial
        activities: [build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: de-risk
    description: >-
      Learn, disprove, de-risk. Evaluate a concept to determine its feasibility
      and learn through experimentation.
    stages:
      - name: discover
        strategy: serial
        activities: [identify]
      - name: prove
        strategy: serial
        activities: [plan, build]

  - name: gh-issue
    description: >-
      Analyze a topic, plan the work, and open a github issue.
    stages:
      - name: discover
        strategy: serial
        activities: [identify]
      - name: file
        strategy: serial
        activities: [gh-issue]

  - name: ship
    description: >-
      An e2e engineering lifecycle: identify, plan, build, and review.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, plan]
      - name: review-plan
        strategy: concurrent
        activities: [plan-comprehension, plan-readiness]
      - name: deliver
        strategy: serial
        activities: [build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: ship-to-outcome
    description: >-
      An e2e engineering lifecycle to launch after you already identified the outcome: plan, build, and review.
    stages:
      - name: discover
        strategy: serial
        activities: [plan]
      - name: review-plan
        strategy: concurrent
        activities: [plan-comprehension, plan-readiness]
      - name: deliver
        strategy: serial
        activities: [build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: ship-to-plan
    description: >-
      An e2e engineering lifecycle to launch after you already identified the plan: import the work the request references, build, and review.
    stages:
      - name: deliver
        strategy: serial
        activities: [import, build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]
