# Every Lifecycle this repository offers.
#
# A Lifecycle is the progression of an objective. It holds Stages; a Stage
# holds Activities. Activities themselves are registered in
# crust.activities.yaml — named here, defined there, so the same Activity
# appears in as many Lifecycles as you like.
#
# Stages run in the order they are declared. A Stage says how its own
# Activities run, and a serial Stage is a SEQUENCE — which is why `deliver`
# holds five Activities rather than being split into five Stages. Grouping is
# not how independence is expressed; `strategy` is.
#
#
#   strategy: serial      one after another, in the order listed (the default)
#   strategy: concurrent  all at once, because they do not depend on each other
#
# `concurrent` is a claim, not a grouping. It says these Activities can run
# against the same working tree at the same time without reading each other's
# half-finished work, and it is enforced: a concurrent Stage whose Activities
# declare overlapping `writes` is refused at load.
#
# Which is why `accept` is the only concurrent Stage here. A reviewer and a
# code-reviewer both read the finished diff and both write only their own
# findings file, so neither can see the other's work in progress. Everything
# else in these chains needs what came before it.
#
# Personal deviations go in crust.lifecycles.local.yaml, which is gitignored.
# See <pi-crust>/cookbooks/examples/crust.lifecycles.local.example.yaml for the whole surface.


lifecycles:
  - name: sdlc
    description: >-
      The whole lifecycle, identify through code-review. Success criteria
      written after the build.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, conceptualize]
      - name: deliver
        strategy: serial
        activities: [plan, design, build, test]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: discover
    description: >-
      The product lifecycle: identify, conceptualize, plan.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, conceptualize, plan]

  - name: deliver
    description: >-
      The engineering lifecycle: build, test, and review.
    stages:
      - name: deliver
        strategy: serial
        activities: [build, test]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: ship
    description: >-
      The engineering lifecycle: plan, build, and review.
    stages:
      - name: ship
        strategy: serial
        activities: [identify, plan, build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: bugfix
    description: >-
      Fix a reported bug, start to finish. Reproduction comes first and gates the
      rest.
    stages:
      - name: diagnose
        strategy: serial
        activities: [diagnose]
      - name: deliver
        strategy: serial
        activities: [plan, test-tdd, build]
      - name: accept
        strategy: concurrent
        activities: [outcome-review, code-review]
      - name: push
        strategy: serial
        activities: [gh-pull-request]

  - name: de-risk
    description: >-
      Learn, disprove, de-risk. Evaluate a concept to determine its feasibility
      and learn through experimentation.
    stages:
      - name: discover
        strategy: serial
        activities: [identify]
      - name: prove
        strategy: serial
        activities: [plan, build]

  # Named `gh-triage`, not `triage`: the latter is already the name of both
  # a Planner and its `just crust triage` recipe, and
  # `modules/use-cases/recipes.test.ts` refuses any Lifecycle whose name a
  # recipe already owns -- a real collision, not merely the cosmetic one
  # `just crust list` shows between a Lifecycle and a Planner section.
  - name: gh-triage
    description: >-
      Analyze a topic, plan the work, and open a github issue. Not the triage
      PLANNER, which recommends a chain and stops.
    stages:
      - name: discover
        strategy: serial
        activities: [identify, plan, gh-issue]
