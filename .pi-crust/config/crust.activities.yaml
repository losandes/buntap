# Every Activity this repository offers, and every Planner it tunes.
#
# An Activity is a discrete unit of work. A Lifecycle in crust.lifecycles.yaml
# names Activities; this file defines them, so the same Activity takes part in
# as many Lifecycles as you like without being duplicated.
#
# An entry carries BOTH halves of an Activity, because they are one thing:
#
#   who performs it   model, thinking, tools, writes, prompt_engineering
#   what the work is  output, gates, input, attempts, commit
#
#   output    the envelope contract it answers, by name. The names are
#             published by the package; an unknown one is refused at load,
#             listing what you could have written instead.
#   gates     what its envelope must survive, by name, same rule. `checks`
#             runs this repository's own commands from routing.checks — it is
#             declared per Activity, never automatic: after `test` the suite
#             is red on purpose, and after `plan` the only change is markdown.
#   input     `upstream` (the default) or `changes`, the run's own diff.
#   attempts  Activity Runs of ONE instance this run may spend, the first
#             included. Default 2. A gate failure, a revision and a
#             regression all come out of this one budget. Declare 1 on
#             anything whose re-execution is expensive.
#   commit    land this Activity's own change, in its envelope's words, once
#             every gate on it has passed. `--commit false` turns this off
#             for a whole run; there is no flag that turns it on.
#
# This lists everything pi-crust offers rather than only your additions, which
# is what lets you remove one: delete the entry and the capability is gone.
#
# The order here is the order interactive lists display. Reorder the file to
# reorder the menu — nothing else records a sequence, so nothing else can
# drift out of step with the Activities that exist.
#
# Prompt references resolve against this repository first and the pi-crust
# package second: write .pi-crust/prompt-engineering/plan/system.md and it
# wins, with no other change.
#
# Personal deviations go in crust.activities.local.yaml, which is gitignored.
# A local layer may set any key and may add an Activity this file lacks.
#
# Available Gates:
# - artifactsExist        ensures required artifacts are present
# - filesNonEmpty         ensures every declared artifact is larger than 0B
# - jsonParses            ensures every declared artifact ending .json parses as JSON
# - diffMatchesClaims     ensures the changes match the claims made in the plan (e.g. no other files modified)
# - checks                runs this repository's own commands from routing.checks
# - reproductionSupported ensures a diagnosis's reproduced, steps and confidence are mutually consistent
# - verdictConsistent     ensures the review verdict is consistent with the repository's conventions

activities:
  # Implements the selected plan, and lands it.
  - name: build
    output: buildOutput
    gates: [diffMatchesClaims, checks]
    attempts: 2                          # a re-run of this is a whole build; see SKILL.md
    commit: true                         # lands its own change once both gates pass
    color: green
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: prompt-engineering/build/system.md
      user: prompt-engineering/build/user.md
    writes: ['*'] # unrestricted, except for files listed in defaults.protected_files.

  - name: code-review
    output: reviewOutput
    gates: [artifactsExist, verdictConsistent]
    # model: openai/gpt-5.6-terra
    thinking: high
    color: indigo
    purpose: Judge the change against this repository's ratified conventions, through its own review skill.
    prompt_engineering:
      system: prompt-engineering/code-review/system.md
      user: prompt-engineering/code-review/user.md
    writes: ['{handoff}/code_review.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/

  # 1.3 Conceptualize and 2.2 Design are two agents, not one, because each
  # needs a prohibition the other must not carry: the solutions architect may
  # not choose technology, and the technical architect may not reopen the
  # logical model. One prompt holding both contradicts itself, and the agent
  # resolves the contradiction by settling the schema while still deciding
  # what the domain means.
  - name: conceptualize
    output: conceptualizeOutput
    gates: [artifactsExist]
    color: cyan
    purpose: Decide what the solution must mean and do; choose no technology.
    prompt_engineering:
      system: prompt-engineering/conceptualize/system.md
      user: prompt-engineering/conceptualize/user.md
    writes: ['{handoff}/conceptualize.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/

  # Deliberately has NO database access. It writes the query for a person to run:
  # an agent deciding on its own to query a live store cannot see the load it
  # would add, the replica it is really pointed at, or what the query will do.
  - name: data-research
    output: researchOutput
    gates: [artifactsExist]
    color: violet
    purpose: Establish what the data can show, and what it cannot.
    prompt_engineering:
      system: prompt-engineering/data-research/system.md
      user: prompt-engineering/data-research/user.md
    writes: ['{handoff}/data-research.md']  # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check

  - name: design
    output: designOutput
    gates: [artifactsExist]
    color: pink
    purpose: Give the logical architecture a physical shape here, observability included.
    prompt_engineering:
      system: prompt-engineering/design/system.md
      user: prompt-engineering/design/user.md
    writes: ['{handoff}/design.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/

  # 1.2b Diagnose. For work that starts from a symptom rather than from a
  # wish — a bug report, usually written by someone who cannot see the code.
  # It may write a failing test and nothing else: the moment a cause becomes
  # obvious, fixing it is tempting, and a fix applied here is one nobody
  # planned or reviewed, with the reproduction that would have proved it gone.
  - name: diagnose
    output: diagnosisOutput
    gates: [artifactsExist, reproductionSupported]
    color: purple
    purpose: Reproduce the reported behaviour and name its cause, with evidence.
    prompt_engineering:
      system: prompt-engineering/diagnose/system.md
      user: prompt-engineering/diagnose/user.md
    # Tests only. A diagnosis is worth far more when it leaves behind a test
    # that fails for the bug, and worth nothing if the diagnostician "helpfully"
    # fixes what it found — a fix nobody planned, tested or reviewed, with the
    # reproduction destroyed. Narrow these globs to your own test layout.
    writes:
      - "{handoff}/diagnosis.md"
      - "**/*.test.*"
      - "**/*_test.*"
      - "**/test/**"
      - "**/tests/**"
      - "**/spec/**"

  - name: document
    output: documentOutput
    gates: [artifactsExist, filesNonEmpty]
    input: changes                       # the run's own diff, not the activity before it
    commit: true                         # the write-up lands in its own commit
    # model: openai/gpt-5.6-luna
    color: blue
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: prompt-engineering/document/system.md
      user: prompt-engineering/document/user.md
    writes:                        # documentation only
      - "{handoff}/document.md"
      - "**/adr/"
      - "**/docs/"                 # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"

  # Industry convention against house interpretation; never invents a rule to close a gap.
  - name: domain-research
    output: researchOutput
    gates: [artifactsExist]
    color: pink
    purpose: Model the domain and the rules that actually govern it.
    prompt_engineering:
      system: prompt-engineering/domain-research/system.md
      user: prompt-engineering/domain-research/user.md
    writes: ['{handoff}/domain-research.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check

  # Opens ONE GitHub issue from the chain that came before it. Its effect is
  # external, so there is no `commit:` here: nothing in the working tree
  # changes, and the handoff document is the record of what was filed.
  - name: gh-issue
    output: ghIssueOutput
    gates: [artifactsExist, filesNonEmpty, issueCreated]
    color: indigo
    purpose: Open one GitHub issue carrying the chain's findings; change nothing in the repository.
    prompt_engineering:
      system: prompt-engineering/gh-issue/system.md
      user: prompt-engineering/gh-issue/user.md
    writes: ['{handoff}/gh_issue.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:                       # bash is how `gh` is reached; no edit -- it changes no existing file
      - bash
      - read
      - write

  # 1.2 Identify. Outcome and success criteria, never implementation — the
  # criteria it writes are what `review` rules against and what a human checks
  # at launch, so a vague one here is a vague verdict three activities later.
  - name: identify
    output: identifyOutput
    gates: [artifactsExist]
    color: blue
    purpose: Turn a problem into an outcome with criteria anyone could check.
    prompt_engineering:
      system: prompt-engineering/identify/system.md
      user: prompt-engineering/identify/user.md
    writes: ['{handoff}/identify.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/

  - name: outcome-review
    output: reviewOutput
    gates: [artifactsExist, verdictConsistent]
    # model: openai/gpt-5.6-terra
    thinking: high
    color: lime
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: prompt-engineering/outcome-review/system.md
      user: prompt-engineering/outcome-review/user.md
    writes: ['{handoff}/outcome_review.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/

  - name: plan
    output: planOutput
    gates: [artifactsExist, filesNonEmpty]
    model: anthropic/claude-opus-5
    # model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: violet
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: prompt-engineering/plan/system.md
      user: prompt-engineering/plan/user.md
    harness_engineering:
      - harness-engineering/subagents.ts      # registers the four subagent_* tools below
    writes:                        # the plan, and nothing in the repository itself
      - "{handoff}/plan.md"        # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - bash
      - edit
      - read
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: scout
    output: scoutOutput
    gates: [artifactsExist]
    color: orange
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: prompt-engineering/scout/system.md
      user: prompt-engineering/scout/user.md
    harness_engineering:
      - harness-engineering/subagents.ts    # registers the four subagent_* tools below
    writes: ['{handoff}/scout_findings.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # Reads adversarially. Demonstrated, plausible and speculative are three different claims.
  - name: security-research
    output: researchOutput
    gates: [artifactsExist]
    color: rose
    purpose: Establish how this could fail, be misused, or be attacked.
    prompt_engineering:
      system: prompt-engineering/security-research/system.md
      user: prompt-engineering/security-research/user.md
    writes: ['{handoff}/security-research.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check

  # The repository is its primary source; documentation and specs corroborate it.
  - name: technical-research
    output: researchOutput
    gates: [artifactsExist]
    color: purple
    purpose: Establish what is technically true, feasible, and evidenced.
    prompt_engineering:
      system: prompt-engineering/technical-research/system.md
      user: prompt-engineering/technical-research/user.md
    writes: ['{handoff}/technical-research.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check

  # Writing a test and running one are different jobs, so only one of them is
  # an Activity. `test` is an agent because deciding what would prove a change
  # correct is judgement; RUNNING the suite is a known command, so it is the
  # `checks` gate rather than an Activity — see `build` above.
  - name: test-tdd
    output: buildOutput
    gates: [diffMatchesClaims]           # NOT `checks`: after `test` the suite is red on purpose
    commit: true                         # the failing tests land before anything makes them pass
    color: teal
    purpose: Write the tests that would prove the request was implemented (before build); implement nothing else.
    prompt_engineering:
      system: prompt-engineering/test/system.md
      user: prompt-engineering/test/user.md
    writes:                        # "the tester only writes tests" is enforced here,
      - "**/*.test.ts"             # not asserted in a prompt the model may drift from
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/__tests__/"
      - "**/tests/"

  # Writing a test and running one are different jobs, so only one of them is
  # an Activity. `test` is an agent because deciding what would prove a change
  # correct is judgement; RUNNING the suite is a known command, so it is the
  # `checks` gate rather than an Activity — see `build` above.
  - name: test
    output: buildOutput
    gates: [diffMatchesClaims, checks]   # INCLUDE `checks`: after `test` the suite should pass
    commit: true                         # this should come after the build activity
    color: teal
    purpose: Write the tests that prove the request was implemented (after build); implement nothing else.
    prompt_engineering:
      system: prompt-engineering/test/system.md
      user: prompt-engineering/test/user.md
    writes:                        # "the tester only writes tests" is enforced here,
      - "**/*.test.ts"             # not asserted in a prompt the model may drift from
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/__tests__/"
      - "**/tests/"

  - name: ux-design
    output: uxDesignOutput
    gates: [artifactsExist, filesNonEmpty]
    color: orange
    purpose: Specify an interface precisely enough to implement without inventing UX.
    prompt_engineering:
      system: prompt-engineering/ux-design/system.md
      user: prompt-engineering/ux-design/user.md
    writes: ['{handoff}/ux-design.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check

  # Reads support requests, feedback and interfaces — never treats a proposed feature as a need.
  - name: ux-research
    output: researchOutput
    gates: [artifactsExist]
    color: cyan
    purpose: Establish what users need, experience, and struggle with.
    prompt_engineering:
      system: prompt-engineering/ux-research/system.md
      user: prompt-engineering/ux-research/user.md
    writes: ['{handoff}/ux-research.md'] # .pi-crust/data/sessions/{session_id}/context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_enable
      - web_search
      - fetch_content
      - source_check


# ── Planners ─────────────────────────────────────────────────────────────────
# A CLOSED set. Triage recommends a chain and stops; the Operator recommends
# one and runs it. The Composer is the third and has no entry at all, because
# it has no agent: it executes a plan it is handed.
#
# You may change WHO answers and HOW — model, thinking, tools, writes, prompts.
# You cannot add a Planner or remove one, because a Planner is wired into the
# engine rather than named by a Lifecycle, and there is nothing in a Lifecycle
# that could reach a fourth one. A name here that is not a Planner is refused
# at load, with a pointer to `activities:` where it belongs.
#
# Planners carry no `output`, `gates`, `attempts` or `commit`: their work
# configuration is the engine's, not a team's. Their envelope is the only one
# the runner EXECUTES, which is why `stepsValid` gates them — an invented
# Activity name is not a weak suggestion, it is a run that cannot start.

planners:
  - name: operator
    color: amber
    purpose: Choose the smallest chain of Activities that can produce the outcome.
    prompt_engineering:
      system: prompt-engineering/operator/system.md
      user: prompt-engineering/operator/user.md
    writes: ['{handoff}/plan.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:      # enough to size the work, not to do it
      - read
      - write

  - name: triage
    color: amber
    purpose: Choose the smallest chain that can produce the outcome, and hand it back.
    prompt_engineering:
      system: prompt-engineering/triage/system.md
      user: prompt-engineering/triage/user.md
    writes: ['{handoff}/plan.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:      # enough to size the work, not to do it
      - read
      - write

# The terminal Activities: they run once, after a run's revise loop has
# settled with an accepted result, outside the fold entirely — after
# runReviseLoop and before finish. A CLOSED set, in code, exactly as the
# Planners are above: configuration tunes who answers and where it delivers,
# and cannot add a second one, because a terminal Activity is wired into the
# engine. A Lifecycle may only name one as the LAST entry of its LAST stage;
# anywhere else is refused at load.
#
# `delivery` is the deterministic half's own settings — where it pushes and
# opens a pull request — and belongs to the entry rather than to
# crust.config.yaml, because it describes what THIS Activity delivers rather
# than how the run as a whole behaves.
#
#   remote   the git remote it pushes to (default origin)
#   base     the branch it opens the pull request against (default main);
#            also the one branch pi-crust refuses to push FROM, since it
#            never creates a branch for you
#   draft    open the pull request as a draft (default false)

terminal:
  - name: gh-pull-request
    color: teal
    purpose: Push the run's branch and open or update one GitHub pull request describing it.
    prompt_engineering:
      system: prompt-engineering/gh-pull-request/system.md
      user: prompt-engineering/gh-pull-request/user.md
    writes: []                  # read-only: the harness writes the body and runs every git/gh command
    tools:                      # no bash, deliberately -- it composes prose and nothing else
      - read
    delivery:
      remote: origin
      base: main
      draft: false
