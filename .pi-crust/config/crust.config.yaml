
# Agent configuration. One agent, one prompt, one purpose.
# v1 supports Pi only; Claude Code support is planned for v2.
defaults:
  coding_agent: pi
  # Default model. Must be available in `pi --list-models`.
  model: anthropic/claude-sonnet-5 # provider/id
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # Pi extensions loaded with -e
  data_dir: "{primary_worktree}/.pi-crust/data"

  # Default tool allowlist. Agents may override it.
  # Extension tools must also be listed explicitly to be available.
  tools:
    - bash                         # execute commands
    - edit                         # find/replace
    - read                         # read files
    - write                        # create/overwrite files

  # Protected paths cannot be accessed without an agent-specific override.
  # Each agent must declare `writes` for repository changes.
  # `['*']` permits all paths; omission does not.
  # Session data under data_dir is exempt from write restrictions.
  # Globs: * matches within a directory; ** matches across directories.
  protected_files:
    - .pi-crust/config/
    - .env*
    - '**/.env*'

  # Access policies:
  # block = refuse before execution
  # stop  = execute, then terminate the Activity
  # warn  = execute and report
  # allow = execute without enforcement
  # No automatic revert: changes cannot reliably be attributed to agents.
  protected:
    read: block
    write: block

  # Gitignored paths, excluding session data under data_dir.
  # Reads are permitted with warnings; writes are blocked because
  # ignored changes are invisible to normal Git review.
  ignored:
    read: warn
    write: block

  # LIMITATION: Bash enforcement is best-effort. Structured read/write/edit
  # paths are checked precisely, but arbitrary shell commands cannot be.
  # Do not grant bash to agents requiring strict filesystem isolation.

# Activities and lifecycles: crust.activities.yaml, crust.lifecycles.yaml
# Observability: crust.observe.yaml
# Declaration order determines menu order (`just crust list`).

# Route skills and verification checks by changed paths.
# Keep repository-specific skill paths and commands here, not in prompts.
# `when` globs are relative to the Git root; * does not cross directories.
# An empty `when` matches all paths.
routing:
  # Cross-activity routing rules for skills and checks.
  skills:
    - name: code-review
      agents: [code-reviewer]          # omit to give it to every agent
      when: ["**/*.ts", "**/*.tsx"]
      path: .claude/skills/code-review
  checks:
    - name: test
      when: ["**/*.ts"]
      operation: test                  # lint | typecheck | build | test
      argv: [bun, run, test:agent]     # argv LIST, binaries by BARE NAME
      timeout_seconds: 3000
    - name: lint
      when: ["**/*.ts", "**/*.tsx"]
      operation: lint
      argv: [bun, run, lint]
      with_changed_paths: true         # this repo doesn't lint green yet
      timeout_seconds: 3000
    - name: typecheck
      when: ["**/*.ts"]
      operation: typecheck
      argv: [bun, run, typecheck]
      timeout_seconds: 3000
